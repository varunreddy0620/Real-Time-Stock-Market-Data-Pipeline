name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: flake8 src tests --max-line-length=120 --extend-ignore=E203
      - name: Tests
        run: pytest tests -q --cov=src --cov-report=term-missing --cov-fail-under=70

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t real-time-stock-pipeline:ci .

  integration:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Configure deterministic sample mode
        run: |
          cp .env.example .env
          sed -i 's/DATA_SOURCE=auto/DATA_SOURCE=sample/' .env
          sed -i 's/POLL_INTERVAL_SECONDS=5/POLL_INTERVAL_SECONDS=0.05/' .env
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for indicator history
        run: |
          for attempt in {1..90}; do
            minimum_rows=$(docker compose exec -T postgres psql -U pipeline -d market -tAc \
              "SELECT COALESCE(MIN(row_count), 0) FROM (SELECT COUNT(*) row_count FROM raw_ohlcv GROUP BY ticker) counts")
            minimum_processed=$(docker compose exec -T postgres psql -U pipeline -d market -tAc \
              "SELECT COALESCE(MIN(row_count), 0) FROM (SELECT COUNT(*) row_count FROM processed_indicators GROUP BY ticker) counts")
            if [ "${minimum_rows}" -ge 50 ] && [ "${minimum_processed}" -ge 50 ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs producer consumer
          exit 1
      - name: Verify services and data
        run: |
          curl --fail http://localhost:8501/_stcore/health
          test "$(docker compose exec -T redis redis-cli XPENDING stock:ohlcv pipeline | head -1)" = "0"
          docker compose exec -T postgres psql -U pipeline -d market -tAc \
            "SELECT bool_and(sma_50_count > 0) FROM (SELECT COUNT(sma_50) sma_50_count FROM processed_indicators GROUP BY ticker) counts" \
            | grep -qx t
          docker compose exec -T postgres psql -U pipeline -d market -tAc \
            "SELECT bool_and(row_count >= 50) FROM (SELECT COUNT(*) row_count FROM processed_indicators GROUP BY ticker) counts" \
            | grep -qx t
          docker compose exec -T dashboard sh -c \
            "cd /app/dbt_project && dbt build --profiles-dir ."
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
